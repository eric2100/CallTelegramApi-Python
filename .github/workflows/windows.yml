name: Test and build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TEST_LARGE_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test Python CLI including 1 GiB upload
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python build.py
      - name: Test executable including 1 GiB upload
        shell: pwsh
        run: |
          $env:CALL_TELEGRAM_EXE = (Resolve-Path dist/CallTelegramApi.exe).Path
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: CallTelegramApi-Python-Windows
          path: dist/CallTelegramApi-Python-Windows.zip
          if-no-files-found: error
